name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      # Required for cosign keyless signing (.goreleaser.yml's `signs:` /
      # `docker_signs:` blocks): cosign exchanges this OIDC token for a
      # short-lived Fulcio certificate, so no long-lived signing key is ever
      # stored as a secret.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.4'
          # Never restore Go module/build caches written by other runs into the
          # job that signs and publishes release artifacts (cache poisoning).
          cache: false
      - name: Validate release tag, metadata, and generated site
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          go run ./internal/meta/releasecheck --tag "$RELEASE_TAG"
          go test ./internal/meta ./cmd
          (
            cd tools/site-build
            go run . -strict
          )
          git diff --exit-code -- site
          test -z "$(git status --porcelain --untracked-files=all -- site)"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Provides the `cosign` binary that .goreleaser.yml's
      # `signs:`/`docker_signs:` blocks shell out to.
      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      # Provides the `syft` binary that .goreleaser.yml's `sboms:` block
      # shells out to.
      - name: Install syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      # Move the floating major tag (e.g. v1) to this release so consumers can
      # pin `uses: HodeTech/Leakwatch@v1` and always get the latest v1.x. Skipped
      # for pre-releases (tags containing a hyphen, e.g. v1.5.0-rc.1). Uses the
      # REST API via gh so it works with the persist-credentials: false checkout.
      - name: Update major version tag
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Only move the major tag for a proper vMAJOR.MINOR.PATCH release tag, so
          # a malformed tag (e.g. vnext.1) can never force-move an unrelated ref.
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Tag '$TAG' is not a vX.Y.Z release tag; skipping major-tag move."
            exit 0
          fi
          MAJOR="${TAG%%.*}"   # v1.5.0 -> v1
          echo "Pointing ${MAJOR} at ${SHA} (${TAG})"
          if gh api "repos/${REPO}/git/refs/tags/${MAJOR}" >/dev/null 2>&1; then
            gh api -X PATCH "repos/${REPO}/git/refs/tags/${MAJOR}" -f sha="${SHA}" -F force=true >/dev/null
          else
            gh api -X POST "repos/${REPO}/git/refs" -f ref="refs/tags/${MAJOR}" -f sha="${SHA}" >/dev/null
          fi
          echo "Major tag ${MAJOR} now points at ${TAG}."
