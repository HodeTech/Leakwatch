name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/user-manuals/**"
      - "internal/meta/release.go"
      - "tools/site-build/**"
      - ".github/workflows/site-deploy.yml"
  workflow_dispatch:

# Allow one concurrent deployment; cancel in-progress runs for the same ref.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Least privilege: the build job only needs to read the repo.
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.4"
          # The output is published to GitHub Pages: build from a clean cache
          # so state written by other runs cannot alter the deployed site.
          cache: false

      - name: Compile user manuals into the site
        working-directory: tools/site-build
        run: go run . -strict

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
          # v4+ drops dotfiles by default; site/.nojekyll must keep shipping
          # exactly as it did under v3 (and v5 bundles upload-artifact v7 on
          # Node 24 instead of v4 on the deprecated Node 20).
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Only the deploy job needs write access to Pages and an OIDC token.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
